name: Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_TEST_RUNNER: Microsoft.Testing.Platform
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      id-token: write
      actions: write
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 👈 This forces GitHub to pull ALL history and tags

      - name: Calculate Version
        id: get_version
        run: |
          set -eu
          # 1. Instantly fail if not inside a valid Git repository clone
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "::error::This directory is not a Git repository. Did you forget actions/checkout?"
            exit 1
          fi
          HEAD_COMMIT=$(git log -1 --pretty=format:%s)
          if echo "$HEAD_COMMIT" | grep -Eiq '\btrace[[:space:]]*:'; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n 1) 
          echo "$LAST_TAG"
          if [ -z "$LAST_TAG" ]; then
            echo "First Release Detected"
            echo "version=0.0.100" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:%s) 
          PREV_VERSION=${LAST_TAG#v} 
          VERSION=$PREV_VERSION
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2) 
          PATCH=$(echo "$VERSION" | cut -d. -f3) 
          if echo "$COMMITS" | grep -iq '^trace:'; then
            echo "release=fasle" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$COMMITS" | grep -qP "(?i)\b(trace|note|wip)\b\s*:"; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Check for major breaking changes
          if echo "$COMMITS" | grep -qP "(?i)\bbreak\b\s*:"; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0

          # 3. Check for new features
          elif echo "$COMMITS" | grep -qP "(?i)\bfeat\b\s*:"; then
            MINOR=$((MINOR + 1))
            PATCH=0

          # 4. Check for bug fixes
          elif echo "$COMMITS" | grep -qP "(?i)\bfix\b\s*:"; then
            PATCH=$((PATCH + 1))

          # 5. Fallback if no valid token was found anywhere
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Error: This is not a release... there are no fix:, break:, or feat: commits!"
            exit 0
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Current Release $VERSION"
          echo "Next Release $NEW_VERSION"

          echo "previous_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        if: steps.get_version.outputs.release == 'true'
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        if: steps.get_version.outputs.release == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        if: steps.get_version.outputs.release == 'true'
        run: dotnet restore "$GITHUB_WORKSPACE/src/GameHost.slnx"

      - name: Build All Projects
        if: steps.get_version.outputs.release == 'true'
        run: dotnet build "$GITHUB_WORKSPACE/src/GameHost.slnx" --no-restore --configuration Release

      - name: Run All Unit Tests
        if: steps.get_version.outputs.release == 'true'
        run: dotnet test "$GITHUB_WORKSPACE/src/GameHost.slnx" --no-build --configuration Release --verbosity normal -p:TreatWarningsAsErrors=false

      - name: Install Packing Tool
        if: steps.get_version.outputs.release == 'true'
        run: |
          PANEL_VERSION=$(grep -oP '(?<=<PanelVersion>).*?(?=</PanelVersion>)' "$GITHUB_WORKSPACE/src/Directory.Packages.props")
          if [ -z "$PANEL_VERSION" ]; then
            echo "ERROR: Failed to extract PanelVersion from Directory.Packages.props"
            exit 1
          fi
          echo "PanelVersion=$PANEL_VERSION"
          dotnet tool install --global LunaticPanel.Package.Tool --version "$PANEL_VERSION"

      - name: Pack NuGet packages
        if: steps.get_version.outputs.release == 'true'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          mkdir -p "/tmp/artifacts/output"
          KEY_PROJECT="$GITHUB_WORKSPACE/src/GameHost.Keys/GameHost.Keys.csproj"
          dotnet pack "$KEY_PROJECT" -c Release -o "/tmp/artifacts/output" /p:Version=$VERSION

      - name: Validate Plugins
        if: steps.get_version.outputs.release == 'true'
        run: |
          mkdir -p /tmp/artifacts/build

          VERSION="${{ steps.get_version.outputs.version }}"

          PLUGIN="$GITHUB_WORKSPACE/src/GameHost/GameHost.csproj"
          FILE_NAME=$(basename "$PLUGIN")
          PROJECT_NAME="${FILE_NAME%.csproj}"

          TARGET_BUILD_DIR="/tmp/artifacts/plugins_build/$PROJECT_NAME"
          mkdir -p "$TARGET_BUILD_DIR"

          dotnet publish "$PLUGIN" -r linux-x64 -c Release -o "$TARGET_BUILD_DIR" \
            /p:FileVersion=$VERSION \
            /p:InformationalVersion=$VERSION \
            /p:Version=$VERSION \
            /p:AssemblyVersion=$VERSION

          lpkg-cli pack \
            --input "$TARGET_BUILD_DIR" \
            --output "/tmp/artifacts/output" \
            --version "$VERSION"

          EXPECTED_PKG="/tmp/artifacts/output/${PROJECT_NAME}.${VERSION}.lpkg"

          if [ ! -s "$EXPECTED_PKG" ]; then
            ls -R /tmp/artifacts/output
            echo "❌ Error: Packed file for ${PROJECT_NAME} version ${VERSION} was not generated or is empty!"
            exit 1
          else
            echo "✅ Verified: $(basename "$EXPECTED_PKG") exists and is valid."
          fi